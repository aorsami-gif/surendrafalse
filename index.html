<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Surendra Beatdown 3D Arcade</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #050508;
            font-family: 'Segoe UI', Arial, sans-serif;
            touch-action: none; user-select: none;
        }
        #canvas-container {
            width: 100%; height: 100%;
            position: absolute; top: 0; left: 0; z-index: 1;
        }
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 16px;
        }
        .hud-header {
            display: flex; justify-content: space-between; align-items: flex-start; width: 100%;
        }
        .score-board {
            background: rgba(15, 15, 25, 0.9); border: 2px solid #ff3366;
            padding: 10px 20px; border-radius: 12px;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.4); color: #fff; text-align: center;
        }
        .score-board h1 { margin: 0; font-size: 16px; color: #ff3366; letter-spacing: 1px; }
        .score-board p { margin: 4px 0 0 0; font-size: 22px; font-weight: bold; }
        
        .health-container {
            width: 230px; background: rgba(20, 20, 30, 0.95);
            border: 2px solid #00ffff; border-radius: 12px; padding: 10px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }
        .character-name-tag {
            color: #ffff00; font-size: 14px; font-weight: 900;
            margin-bottom: 6px; text-shadow: 0 0 10px rgba(255, 255, 0, 0.8);
            display: flex; justify-content: space-between; align-items: center;
        }
        .health-bar-bg {
            width: 100%; height: 14px; background: #222; border-radius: 7px;
            overflow: hidden; border: 1px solid #555;
        }
        .health-bar-fill {
            width: 100%; height: 100%;
            background: linear-gradient(90deg, #ff3366, #ff9933);
            transition: width 0.1s ease-out;
        }
        #announcement {
            position: absolute; top: 30%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 28px; font-weight: 900; color: #ffff00;
            text-shadow: 0 0 20px rgba(255, 255, 0, 0.9), 2px 2px 0px #000;
            pointer-events: none; transition: transform 0.15s ease-out, opacity 0.15s;
            opacity: 0; text-align: center; z-index: 20; width: 100%;
        }
        .controls-hint {
            text-align: center; color: rgba(255, 255, 255, 0.8); font-size: 12px;
            background: rgba(0, 0, 0, 0.6); padding: 5px 12px; border-radius: 15px;
            backdrop-filter: blur(5px); align-self: center; margin-bottom: 8px;
        }
        .action-buttons {
            display: flex; gap: 10px; justify-content: center; pointer-events: auto;
        }
        .punch-btn {
            background: linear-gradient(135deg, #ff3366, #cc0033);
            border: none; color: white; padding: 14px 20px; font-size: 15px;
            font-weight: bold; border-radius: 35px;
            box-shadow: 0 6px 18px rgba(255, 51, 102, 0.5);
            cursor: pointer; transition: transform 0.1s;
        }
        .punch-btn:active { transform: scale(0.92); }
        
        #audio-prompt, #victory-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 10, 0.98); display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; pointer-events: auto; color: white; text-align: center; padding: 20px;
        }
        #victory-screen { display: none; background: rgba(10, 20, 10, 0.96); z-index: 200; }
        
        .vault-box {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 140, 0, 0.15));
            border: 2px solid #ffd700; border-radius: 16px; padding: 14px 20px;
            margin: 12px 0; box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
            max-width: 350px;
        }
        .vault-box h2 { color: #ffd700; font-size: 17px; margin: 0 0 4px 0; text-shadow: 0 0 10px rgba(255, 215, 0, 0.6); }
        .vault-box p { color: #fff; font-size: 13px; margin: 0; }

        .difficulty-selector {
            display: flex; gap: 10px; margin: 15px 0;
        }
        .diff-btn {
            background: rgba(255, 255, 255, 0.1); border: 2px solid #555;
            color: #fff; padding: 8px 16px; border-radius: 20px; font-weight: bold;
            cursor: pointer; transition: all 0.2s;
        }
        .diff-btn.active {
            background: #00ffff; border-color: #00ffff; color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
        }

        #audio-prompt button, #victory-screen button {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: none; color: #000; font-size: 18px; font-weight: bold;
            padding: 12px 32px; border-radius: 30px; cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.7); margin-top: 10px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="audio-prompt">
        <h1 style="color: #ff3366; margin-bottom: 6px; font-size: 26px;">SURENDRA BEATDOWN 3D</h1>
        <p style="color: #ccc; max-width: 300px; font-size: 13px; margin-bottom: 10px;">Select Difficulty & Tap to Start!</p>
        
        <div class="difficulty-selector">
            <button class="diff-btn" onclick="setDiff(0.15, 'Easy')">Easy</button>
            <button class="diff-btn active" onclick="setDiff(0.3, 'Medium')">Medium</button>
            <button class="diff-btn" onclick="setDiff(0.5, 'Hardcore')">Hardcore</button>
        </div>

        <button id="start-game-btn">START GAME</button>
    </div>

    <div id="victory-screen">
        <h1 style="color: #ffff00; font-size: 34px; margin-bottom: 4px;">VICTORY!</h1>
        <p style="color: #fff; font-size: 18px; max-width: 380px; line-height: 1.3; margin-bottom: 10px;">Congrats berojgar game jiteko ma!</p>
        
        <div class="vault-box">
            <h2>🏆 BEROJGAR GOLDEN VAULT UNLOCKED</h2>
            <p>Reward: Unlimited Chai & Wi-Fi Access! Lifetime Achievement Unlocked.</p>
        </div>

        <button id="restart-btn">PLAY AGAIN</button>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud-header">
            <div class="score-board">
                <h1>SCORE</h1>
                <p id="score-val">0</p>
            </div>
            <div class="health-container">
                <div class="character-name-tag">
                    <span>🥊 SURENDRA</span>
                    <span id="hp-val">500/500</span>
                </div>
                <div class="health-bar-bg">
                    <div id="hp-fill" class="health-bar-fill"></div>
                </div>
            </div>
        </div>

        <div id="announcement">GREAT HIT!</div>

        <div style="display: flex; flex-direction: column; width: 100%;">
            <div class="controls-hint">Tap Buttons Below or Key J / K / L</div>
            <div class="action-buttons">
                <button class="punch-btn" id="btn-jab">JAB (J)</button>
                <button class="punch-btn" id="btn-hook" style="background: linear-gradient(135deg, #ff9933, #cc5500);">HOOK (K)</button>
                <button class="punch-btn" id="btn-uppercut" style="background: linear-gradient(135deg, #00ffff, #0088cc); color: #000;">UPPERCUT (L)</button>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, surendraGroup;
        let head, torso, leftArm, rightArm;
        let audioCtx = null;
        let score = 0;
        let maxHP = 500;
        let surendraHP = 500;
        let isKnockedOut = false;
        let animTimer = 0;
        let dodgeChance = 0.3; // Default Medium

        const cheers = [
            "BOOM! 💥", "OOF! 🤭", "CRITICAL! 🔥", "SAVAGE! ⚡", "SMASH! 🥊", 
            "Billa udayo! 😎", "Hanna sakinas! 🤪", "Chai khana jaa! ☕", "Legendary! 🚀"
        ];

        const dodgeTaunts = [
            "SURENDRA DODGED! 😂", "Miss garyo solti! 🏃‍♂️", "Too slow! 💨", 
            "Bbachha haru jasto hanna! 🥱", "Nice try, berojgar! 🎯"
        ];

        function setDiff(chance, name) {
            dodgeChance = chance;
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        function playSound(freq, duration) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + duration);
                
                gain.gain.setValueAtTime(1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function initThree() {
            const container = document.getElementById('canvas-container');
            container.innerHTML = '';

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050508, 0.04);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.7, 4.2);
            camera.lookAt(0, 1.1, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));

            const light1 = new THREE.DirectionalLight(0xffffff, 1.2);
            light1.position.set(2, 5, 3);
            scene.add(light1);

            const floor = new THREE.Mesh(
                new THREE.CylinderGeometry(4, 4.2, 0.3, 32),
                new THREE.MeshStandardMaterial({ color: 0x1a1a24, roughness: 0.4 })
            );
            floor.position.y = -0.15;
            scene.add(floor);

            createCharacter();
            window.addEventListener('resize', onWindowResize);
        }

        function createCharacter() {
            surendraGroup = new THREE.Group();
            scene.add(surendraGroup);

            const skin = new THREE.MeshStandardMaterial({ color: 0xd4a373 });
            const shirt = new THREE.MeshStandardMaterial({ color: 0x223344 });
            const pants = new THREE.MeshStandardMaterial({ color: 0x1d3557 });

            torso = new THREE.Mesh(new THREE.BoxGeometry(0.75, 1.0, 0.4), shirt);
            torso.position.y = 1.1;
            surendraGroup.add(torso);

            // Canvas texture with 👁️👁️ and 👄
            const faceCanvas = document.createElement('canvas');
            faceCanvas.width = 256;
            faceCanvas.height = 256;
            const ctx = faceCanvas.getContext('2d');

            ctx.fillStyle = '#d4a373';
            ctx.fillRect(0, 0, 256, 256);

            ctx.font = '65px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('👁️  👁️', 128, 90);

            ctx.font = '75px sans-serif';
            ctx.fillText('👄', 128, 175);

            const faceTexture = new THREE.CanvasTexture(faceCanvas);

            const headMaterials = [
                skin, skin, skin, skin,
                new THREE.MeshStandardMaterial({ map: faceTexture }), // Front face
                skin
            ];

            head = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.5, 0.48), headMaterials);
            head.position.y = 1.85;
            surendraGroup.add(head);

            const hair = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.15, 0.5), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            hair.position.y = 0.22;
            head.add(hair);

            const armGeo = new THREE.BoxGeometry(0.2, 0.8, 0.2);
            leftArm = new THREE.Mesh(armGeo, skin);
            leftArm.position.set(-0.48, 1.1, 0);
            surendraGroup.add(leftArm);

            rightArm = new THREE.Mesh(armGeo, skin);
            rightArm.position.set(0.48, 1.1, 0);
            surendraGroup.add(rightArm);

            const legGeo = new THREE.BoxGeometry(0.28, 0.9, 0.28);
            const lLeg = new THREE.Mesh(legGeo, pants);
            lLeg.position.set(-0.2, 0.45, 0);
            surendraGroup.add(lLeg);

            const rLeg = new THREE.Mesh(legGeo, pants);
            rLeg.position.set(0.2, 0.45, 0);
            surendraGroup.add(rLeg);
        }

        function triggerHit(type) {
            if (isKnockedOut) return;

            // Difficulty based dodge chance
            let isDodged = Math.random() < dodgeChance;
            const ann = document.getElementById('announcement');

            if (isDodged) {
                playSound(80, 0.1);
                ann.innerText = dodgeTaunts[Math.floor(Math.random() * dodgeTaunts.length)];
                ann.style.color = '#ff3366';
                ann.style.transform = 'translate(-50%, -50%) scale(1.1)';
                ann.style.opacity = '1';
                setTimeout(() => { ann.style.opacity = '0'; }, 350);
                
                surendraGroup.position.x = (Math.random() > 0.5 ? 1 : -1) * 0.6;
                setTimeout(() => { surendraGroup.position.x = 0; }, 200);
                return;
            }

            let dmg = type === 'uppercut' ? 45 : type === 'hook' ? 30 : 20;
            playSound(type === 'uppercut' ? 240 : 140, 0.2);

            score += dmg;
            surendraHP = Math.max(0, surendraHP - dmg);

            document.getElementById('score-val').innerText = score;
            document.getElementById('hp-val').innerText = surendraHP + '/' + maxHP;
            document.getElementById('hp-fill').style.width = (surendraHP / maxHP * 100) + '%';

            ann.innerText = cheers[Math.floor(Math.random() * cheers.length)];
            ann.style.color = '#ffff00';
            ann.style.transform = 'translate(-50%, -50%) scale(1.2)';
            ann.style.opacity = '1';
            setTimeout(() => { ann.style.opacity = '0'; }, 350);

            animTimer = 0.8;
            surendraGroup.position.x = (Math.random() - 0.5) * 0.4;
            if (type === 'uppercut') surendraGroup.rotation.x = -0.4;

            if (surendraHP <= 0) {
                isKnockedOut = true;
                ann.style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('victory-screen').style.display = 'flex';
                }, 500);
            }
        }

        function resetGame() {
            surendraHP = maxHP;
            score = 0;
            isKnockedOut = false;
            document.getElementById('score-val').innerText = score;
            document.getElementById('hp-val').innerText = maxHP + '/' + maxHP;
            document.getElementById('hp-fill').style.width = '100%';
            document.getElementById('announcement').style.opacity = '0';
            document.getElementById('victory-screen').style.display = 'none';
            surendraGroup.position.set(0, 0, 0);
            surendraGroup.rotation.set(0, 0, 0);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate(timestamp) {
            requestAnimationFrame(animate);
            if (!isKnockedOut && animTimer <= 0) {
                const t = timestamp * 0.003;
                surendraGroup.position.y = Math.sin(t) * 0.04;
                head.rotation.y = Math.sin(t * 0.5) * 0.1;
            } else if (animTimer > 0) {
                animTimer -= 0.05;
                if (animTimer <= 0 && !isKnockedOut) {
                    surendraGroup.position.set(0, 0, 0);
                    surendraGroup.rotation.set(0, 0, 0);
                }
            } else if (isKnockedOut) {
                surendraGroup.rotation.z = Math.PI / 2;
                surendraGroup.position.y = 0.2;
            }
            if (renderer && scene && camera) renderer.render(scene, camera);
        }

        document.getElementById('start-game-btn').addEventListener('click', () => {
            document.getElementById('audio-prompt').style.display = 'none';
            initThree();
            animate(0);
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            resetGame();
        });

        document.getElementById('btn-jab').addEventListener('click', () => triggerHit('jab'));
        document.getElementById('btn-hook').addEventListener('click', () => triggerHit('hook'));
        document.getElementById('btn-uppercut').addEventListener('click', () => triggerHit('uppercut'));

        window.addEventListener('keydown', (e) => {
            e.preventDefault();
            if (e.code === 'KeyJ' || e.code === 'Space') triggerHit('jab');
            if (e.code === 'KeyK') triggerHit('hook');
            if (e.code === 'KeyL') triggerHit('uppercut');
        });
    </script>
</body>
</html>
